[tox]
envlist = py{310,311,312}, lint, docs, security
isolated_build = true

[testenv]
deps = 
    pytest>=7.0.0
    pytest-cov>=4.0.0
    pytest-mock>=3.10.0
    pytest-asyncio>=0.21.0
commands = 
    pytest tests/ -v --cov=renta --cov-report=term-missing {posargs}

[testenv:lint]
deps = 
    black>=23.0.0
    isort>=5.12.0
    flake8>=6.0.0
    mypy>=1.0.0
commands = 
    black --check renta/ tests/ examples/
    isort --check-only renta/ tests/ examples/
    flake8 renta/ tests/ examples/
    mypy renta/

[testenv:format]
deps = 
    black>=23.0.0
    isort>=5.12.0
commands = 
    black renta/ tests/ examples/
    isort renta/ tests/ examples/

[testenv:docs]
deps = 
    mkdocs>=1.4.0
    mkdocs-material>=9.0.0
    mkdocstrings[python]>=0.20.0
commands = 
    mkdocs build --strict

[testenv:security]
deps = 
    bandit>=1.7.0
    safety>=2.0.0
commands = 
    bandit -r renta/ -f json
    safety check

[testenv:integration]
deps = 
    pytest>=7.0.0
    pytest-cov>=4.0.0
    pytest-mock>=3.10.0
    pytest-asyncio>=0.21.0
commands = 
    pytest tests/ -v -m "integration" {posargs}

[flake8]
max-line-length = 100
extend-ignore = E203, W503, D100, D101, D102, D103, D104, D105
exclude = 
    .git,
    __pycache__,
    build,
    dist,
    .tox,
    .venv,
    venv

[coverage:run]
source = renta
omit = 
    */tests/*
    */test_*
    setup.py

[coverage:report]
exclude_lines = 
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod